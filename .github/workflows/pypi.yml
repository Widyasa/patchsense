# Build pip wheels with maturin. Publish only when a v* tag is pushed,
# using PyPI trusted publishing (no password). Widya configures the
# trusted publisher on pypi.org. This file does not create tokens.
#
# A job-level `if` cannot read `matrix` (GitHub rejects the workflow before
# any job starts). Platform filters therefore live on the job, not inside
# the matrix expression.

name: PyPI

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          manylinux: auto
          manifest-path: crates/patchsense/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist

  linux-arm64:
    name: Linux aarch64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist
          manylinux: auto
          manifest-path: crates/patchsense/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-aarch64
          path: dist

  macos:
    name: macOS ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manifest-path: crates/patchsense/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: Windows x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          manifest-path: crates/patchsense/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x64, linux-arm64, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

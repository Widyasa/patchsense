tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
